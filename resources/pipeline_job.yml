# Databricks Asset Bundle job: Bronze → Silver → Gold → Report on serverless compute.
# Deploy with: databricks bundle deploy && databricks bundle run amsterdam_rental_pipeline

resources:
  jobs:
    amsterdam_rental_pipeline:
      name: Amsterdam Rental Revenue Pipeline
      description: >
        Medallion architecture pipeline comparing Airbnb short-term vs Kamernet
        long-term rental revenue per Amsterdam postcode. Runs Bronze → Silver → Gold,
        then renders the investment-potential map.

      # Job parameters are passed to every notebook task and fill its widgets.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
        - name: repo_root
          default: ${workspace.file_path}

      # Serverless compute: no job_clusters block (works on workspaces that disallow
      # classic clusters, including Free Edition).
      tasks:
        - task_key: bronze_ingestion
          description: Create schema + volume, stage the source zips, ingest raw Delta tables
          notebook_task:
            notebook_path: ../notebooks/01_bronze.ipynb

        - task_key: silver_cleaning
          description: Clean, enrich, and filter to Amsterdam. Validate and backfill zipcodes.
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_silver.ipynb

        - task_key: gold_revenue
          description: Revenue per listing and postcode, investment-potential tiers, UC tables.
          depends_on:
            - task_key: silver_cleaning
          notebook_task:
            notebook_path: ../notebooks/03_gold.ipynb

        - task_key: report_map
          description: Render the investment-potential map PNG from the gold table.
          depends_on:
            - task_key: gold_revenue
          notebook_task:
            notebook_path: ../notebooks/04_report.ipynb

      # Run once manually; add a schedule here for recurring runs
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"
      #   timezone_id: Europe/Amsterdam
